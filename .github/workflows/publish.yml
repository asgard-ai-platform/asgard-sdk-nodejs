name: Publish to npm

# Publishes @asgard-js/nodejs to the public npm registry using npm Trusted
# Publishing (OIDC). The repository must be registered as a trusted publisher
# for this package on npmjs.com before the first run — no NPM_TOKEN is used.
#
# ############################################################################
# # !! DO NOT RUN THIS WORKFLOW ON A SELF-HOSTED RUNNER !!                   #
# ############################################################################
# #                                                                          #
# # `runs-on:` MUST stay as a GitHub-hosted runner (e.g. `ubuntu-latest`).   #
# #                                                                          #
# # Why: npm Trusted Publishing verifies the OIDC token's `runner_environ-   #
# # ment` claim and accepts ONLY `github-hosted`. Self-hosted runners emit   #
# # `runner_environment: self-hosted`, which npm rejects — publishing will   #
# # fail with a 4xx OIDC error.                                              #
# #                                                                          #
# # The security model also relies on it: self-hosted runners execute on    #
# # infrastructure we control and can be tampered with or shared between    #
# # workloads, so the OIDC token from a self-hosted runner can't prove the  #
# # publish came from a trustworthy, ephemeral environment. GitHub-hosted   #
# # runners are fresh VMs per job — the assumption npm depends on.          #
# #                                                                          #
# ############################################################################

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # Allows re-running a failed publish; the dispatched ref MUST be a v* tag.

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v6

      # ── Guards ────────────────────────────────────────────────────────────
      # Fail fast before installing / building if anything is inconsistent.
      # Release flow: `npm version <patch|minor|major>` writes package.json AND
      # creates a matching v<semver> tag atomically → `git push --follow-tags`.
      # package.json is the single source of truth; the guards verify everything
      # else matches it.
      #
      # The leading "v" on the tag is npm's `tag-version-prefix` default (what
      # `npm version` produces) — it is NOT part of semver itself. The semver
      # regex below validates only the stripped version portion.

      - name: Guard — workflow must run against a tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::This workflow must run against a tag ref. Got: $GITHUB_REF"
            echo "::error::Release with: npm version <patch|minor|major> && git push --follow-tags"
            exit 1
          fi

      - name: Guard — tag must be valid semver (with optional leading 'v')
        run: |
          TAG_VER=${GITHUB_REF_NAME#v}
          # Official semver regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! [[ "$TAG_VER" =~ $SEMVER_RE ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not valid semver (expected v<MAJOR>.<MINOR>.<PATCH>[-pre][+build])."
            exit 1
          fi
          echo "✓ tag $GITHUB_REF_NAME is valid semver"

      - name: Guard — tag must match package.json version
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER=${GITHUB_REF_NAME#v}
          if [[ "$PKG_VER" != "$TAG_VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VER."
            echo "::error::Use 'npm version <bump>' which writes both atomically — do not hand-edit either."
            exit 1
          fi
          echo "✓ package.json version = tag = $PKG_VER"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Guard — version not already published on npm (collision check)
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@asgard-js/nodejs@$VER" version >/dev/null 2>&1; then
            echo "::error::@asgard-js/nodejs@$VER is already published on npm."
            echo "::error::Published versions are immutable. Bump with: npm version <patch|minor|major>"
            exit 1
          fi
          echo "✓ @asgard-js/nodejs@$VER is not yet on npm"

      # ── Build / test / publish ────────────────────────────────────────────

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public
