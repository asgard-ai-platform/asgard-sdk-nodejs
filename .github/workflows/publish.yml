name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Leave empty to use package.json version.'
        required: false
        type: string
      npm_public:
        description: 'Also publish to npm public registry'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@asgard-ai-platform'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set release version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            npm version ${GITHUB_REF_NAME#v} --no-git-tag-version
          elif [[ -n "${{ inputs.version }}" ]]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm public registry
        if: ${{ inputs.npm_public == true }}
        run: |
          npm config set registry https://registry.npmjs.org/
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
