name: Publish to npm

# Publishes @asgard-js/nodejs to the public npm registry using npm Trusted
# Publishing (OIDC). The repository must be registered as a trusted publisher
# for this package on npmjs.com before the first run — no NPM_TOKEN is used.
#
# ############################################################################
# # !! DO NOT RUN THIS WORKFLOW ON A SELF-HOSTED RUNNER !!                   #
# ############################################################################
# #                                                                          #
# # `runs-on:` MUST stay as a GitHub-hosted runner (e.g. `ubuntu-latest`).   #
# #                                                                          #
# # Why: npm Trusted Publishing verifies the OIDC token's `runner_environ-   #
# # ment` claim and accepts ONLY `github-hosted`. Self-hosted runners emit   #
# # `runner_environment: self-hosted`, which npm rejects — publishing will   #
# # fail with a 4xx OIDC error.                                              #
# #                                                                          #
# # The security model also relies on it: self-hosted runners execute on    #
# # infrastructure we control and can be tampered with or shared between    #
# # workloads, so the OIDC token from a self-hosted runner can't prove the  #
# # publish came from a trustworthy, ephemeral environment. GitHub-hosted   #
# # runners are fresh VMs per job — the assumption npm depends on.          #
# #                                                                          #
# ############################################################################

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Set release version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            npm version ${GITHUB_REF_NAME#v} --no-git-tag-version
          elif [[ -n "${{ inputs.version }}" ]]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public
